{% extends 'base.html' %}
{% block title %}Create School Admin - PlaySchool{% endblock %}
{% block content %}
<div class="page-header">
    <h1>👤 Register School Admin</h1>
    <p>Create a dedicated principal account for a campus.</p>
</div>

<div class="card" style="max-width: 600px; margin: auto;">
    <div class="card-header">🔒 Credential Setup</div>
    <div class="card-body" style="padding: 20px;">
        <form method="POST" class="styled-form">
            <div class="form-group">
                <label>Target School</label>
                <select name="school_id" required style="width:100%; padding:10px; border-radius:8px;">
                    {% for s in schools %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <div class="form-group" style="flex:1;">
                    <label>Full Name</label>
                    <input type="text" name="name" required style="width:100%; padding:10px; border-radius:8px;">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Phone</label>
                    <input type="text" name="phone" required style="width:100%; padding:10px; border-radius:8px;">
                </div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label>Email Address</label>
                <input type="email" name="email" required style="width:100%; padding:10px; border-radius:8px;">
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label>Assign Password</label>
                <input type="password" name="password" required style="width:100%; padding:10px; border-radius:8px;">
            </div>
            
            <button type="submit" class="btn-auth" style="margin-top: 25px; background: #e67e22; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight:bold;">✨ Activate Principal Account</button>
        </form>
    </div>
</div>
{% endblock %}
