{% extends 'base.html' %}
{% block title %}Edit School Admin - PlaySchool{% endblock %}
{% block content %}
<div class="page-header">
    <h1>✏️ Edit Admin Details</h1>
    <p>Modify profile or change school assignments.</p>
</div>

<div class="card" style="max-width: 600px; margin: auto;">
    <div class="card-header">🛠️ Configuration Portal</div>
    <div class="card-body" style="padding: 20px;">
        <form method="POST" class="styled-form">
            <div class="form-group">
                <label>Assigned School</label>
                <select name="school_id" required style="width:100%; padding:10px; border-radius:8px;">
                    <option value="">-- Unassigned --</option>
                    {% for s in schools %}
                    <option value="{{ s.id }}" {% if s.id == admin.school_id %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <div class="form-group" style="flex:1;">
                    <label>Full Name</label>
                    <input type="text" name="name" value="{{ admin.name }}" required style="width:100%; padding:10px; border-radius:8px;">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ admin.phone }}" required style="width:100%; padding:10px; border-radius:8px;">
                </div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ admin.email }}" required style="width:100%; padding:10px; border-radius:8px;">
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label>Reset Password (leave blank to keep current)</label>
                <input type="password" name="password" placeholder="Enter new password..." style="width:100%; padding:10px; border-radius:8px;">
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button type="submit" class="btn-auth" style="flex: 2; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight:bold;">💾 Save Changes</button>
                <a href="{{ url_for('super_admin_admins') }}" style="flex: 1; background: #95a5a6; color: white; text-align: center; text-decoration: none; padding: 12px; border-radius: 8px;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
