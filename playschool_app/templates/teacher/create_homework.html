{% extends 'base.html' %}
{% block title %}Create Homework - Teacher{% endblock %}
{% block content %}
<div class="page-header">
    <h1>📝 Assign New Homework</h1>
    <a href="{{ url_for('teacher_homework') }}" class="btn-outline">← Back</a>
</div>
<div class="card" style="max-width:640px;margin:auto">
    <form method="POST" enctype="multipart/form-data" class="form-body">
        <div class="form-group">
            <label>📌 Homework Title</label>
            <input type="text" name="title" placeholder="e.g. Draw your favourite animal" required>
        </div>
        <div class="form-group">
            <label>📄 Description (Instructions)</label>
            <textarea name="description" rows="4" placeholder="What should students do? Give clear instructions..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>🏫 Class</label>
                <select name="class_level" required>
                    <option value="">-- Select --</option>
                    <option value="nursery">🌸 Nursery</option>
                    <option value="lkg">🌼 LKG</option>
                    <option value="ukg">🌻 UKG</option>
                    <option value="all">📢 All Classes</option>
                </select>
            </div>
            <div class="form-group">
                <label>🎯 Type</label>
                <select name="homework_type">
                    <option value="drawing">🎨 Drawing</option>
                    <option value="writing">✏️ Writing</option>
                    <option value="reading">📖 Reading</option>
                    <option value="coloring">🖍️ Coloring</option>
                    <option value="activity">🎯 Activity</option>
                    <option value="other">📝 Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>📅 Due Date</label>
                <input type="date" name="due_date" required>
            </div>
            <div class="form-group">
                <label>⭐ Max Marks</label>
                <input type="number" name="max_marks" value="10" min="1" max="100">
            </div>
        </div>
        <div class="form-group">
            <label>📎 Upload Reference File (PDF/Image/Video)</label>
            <div class="file-upload-zone" onclick="document.getElementById('hwFile').click()">
                <div class="fuz-icon">📁</div>
                <div class="fuz-text">Click to upload or drag & drop</div>
                <div class="fuz-sub">PDF, JPG, PNG, GIF, MP4, DOCX (max 16MB)</div>
                <input type="file" id="hwFile" name="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png,.gif,.mp4,.docx,.doc" onchange="showFileName(this)">
            </div>
            <div id="fileName" class="file-name-preview"></div>
        </div>
        <button type="submit" class="btn-primary" style="width:100%">🚀 Assign Homework!</button>
    </form>
</div>
<script>
function showFileName(input) {
    const el = document.getElementById('fileName');
    el.textContent = input.files[0] ? '✅ Selected: ' + input.files[0].name : '';
}
</script>
{% endblock %}
