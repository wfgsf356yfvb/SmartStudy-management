{% extends 'base.html' %}
{% block title %}Login - PlaySchool{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-emoji">🎒</div>
            <h2>Welcome Back!</h2>
            <p>Login to your PlaySchool account</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" name="password" placeholder="Your password" required>
            </div>
            <div style="text-align:right; margin-top:5px;">
    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
</div>
            <button type="submit" class="btn-auth">🚀 Login Now!</button>
        </form>
        <div class="auth-footer">
            New here? <a href="{{ url_for('register') }}">Create Account ✨</a>
        </div>
     
    </div>
    <div class="auth-deco">
        <div class="deco-bubble b1">🌟</div>
        <div class="deco-bubble b2">📚</div>
        <div class="deco-bubble b3">🎨</div>
        <div class="deco-bubble b4">🎮</div>
    </div>
</div>
{% endblock %}
