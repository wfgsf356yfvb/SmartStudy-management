{% extends 'base.html' %}
{% block title %}Forgot Password - PlaySchool{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-emoji">🔐</div>
            <h2>Reset Password</h2>
            <p>Enter your details to reset your password</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>📱 Phone Number</label>
                <input type="text" name="phone" placeholder="Registered phone number" required>
            </div>
            <div class="form-group">
                <label>🔑 New Password</label>
                <input type="password" name="new_password" placeholder="New password" required>
            </div>
            <div class="form-group">
                <label>🔑 Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-auth">🔄 Reset Password</button>
        </form>
        <div class="auth-footer" style="margin-top: 15px;">
            Remembered? <a href="{{ url_for('login') }}">Back to Login ✨</a>
        </div>
    </div>
    <div class="auth-deco">
        <div class="deco-bubble b1">🌟</div>
        <div class="deco-bubble b2">📚</div>
        <div class="deco-bubble b3">🎨</div>
        <div class="deco-bubble b4">🎮</div>
    </div>
</div>
{% endblock %}
